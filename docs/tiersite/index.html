<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transformers TCG Tier Views</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero-copy">
          <p id="set-eyebrow" class="eyebrow">Loading supported waves…</p>
          <h1 id="page-title">Transformers TCG Tier Views</h1>
          <p id="page-subhead" class="subhead">
            Rank each wave’s Characters, Stratagems, and Battle Cards. Click a multi-sided card to
            cycle its modes, then drag it into A, B, C+, C, C-, D+, D, or F.
          </p>
        </div>
        <div class="hero-actions">
          <label class="set-selector-shell" for="set-selector">
            <span class="set-selector-label">Active wave</span>
            <select id="set-selector" class="set-selector"></select>
          </label>
          <div class="action-row">
            <button id="export-json" class="secondary-button" type="button">Export JSON</button>
            <button id="import-json" class="secondary-button" type="button">Import JSON</button>
            <button id="reset-tier" class="secondary-button" type="button">Reset tier</button>
            <button id="reset-all-tiers" class="secondary-button" type="button">Reset all tiers</button>
          </div>
          <p id="status-message" class="status-message" aria-live="polite"></p>
          <input id="import-file" type="file" accept="application/json,.json" hidden>
        </div>
      </header>

      <section class="tabs-shell">
        <nav id="tabs" class="tabs" aria-label="Tier site tabs"></nav>
      </section>

      <main id="app" class="app-shell"></main>
    </div>

    <script src="data/manifest.js"></script>
    <script src="app.js"></script>
  </body>
</html>
